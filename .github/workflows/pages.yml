name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project sites are served from /<repo>/. Set the BASE_PATH repository variable to "/"
  # when using a custom domain or a <user>.github.io repository.
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Open tabs fetch version.json (with a cache-busting query) to learn about a new deploy.
      - name: Check the build id is in index.html and version.json
        run: grep -q "\"build\":\"$(grep -o 'kandle-build" content="[0-9a-f]*' dist/index.html | cut -d'"' -f3)\"" dist/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
