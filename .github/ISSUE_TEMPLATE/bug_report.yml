name: Bug report
description: Something in Kandle doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and OS, or the agent client if it's about the MCP server (Claude Code, Codex, Cursor...).
    validations:
      required: true
  - type: input
    id: chart
    attributes:
      label: Symbol, timeframe and data source
      placeholder: BTCUSDT, 4H, Binance
  - type: textarea
    id: extra
    attributes:
      label: Screenshot, script or console output
      description: A screenshot helps a lot. For script bugs, paste the script.
