name: Feature request
description: Suggest an indicator, drawing tool, data source or agent feature.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
      description: How you trade or chart today, and what this would change.
